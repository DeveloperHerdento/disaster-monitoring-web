# Same file for staging and production. Each lives in /opt/fire-monitoring-web/<stage>/ with its own .env:
#   COMPOSE_PROJECT_NAME=fire-monitoring-web-<stage>   IMAGE=ghcr.io/developerherdento/fire-monitoring-web:<stage>   PORT=3110
#   + every key from .env.example (FIRMS_MAP_KEY)
services:
  app:
    image: ${IMAGE:?set IMAGE in .env}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8787" # container port; PORT in .env is the host port used below, so it is overridden here
      TZ: UTC
    ports:
      - "127.0.0.1:${PORT:?set PORT in .env}:8787" # localhost only; host nginx + TLS is the public entry
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      retries: 3
